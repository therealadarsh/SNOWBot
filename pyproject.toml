[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowbot"
version = "0.1.0"
description = "Backend-agnostic CLI that installs an agent pipeline into any code project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SNOWBot Contributors" }]
keywords = ["cursor", "agents", "cli", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "keyring>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
snowbot = "snowbot.cli:main"

[project.urls]
Homepage = "https://github.com/therealadarsh/SNOWBot"
Repository = "https://github.com/therealadarsh/SNOWBot"
Issues = "https://github.com/therealadarsh/SNOWBot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snowbot"]

[tool.hatch.build.targets.wheel.force-include]
"src/snowbot/validator/checklist.yaml" = "snowbot/validator/checklist.yaml"
"src/snowbot/templates" = "snowbot/templates"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
packages = ["snowbot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests that hit external services (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
branch = true
source = ["snowbot"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
