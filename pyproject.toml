[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowbot"
version = "0.1.0"
description = "Backend-agnostic CLI that installs an agent pipeline into any code project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SNOWBot Contributors" }]
keywords = ["cursor", "agents", "cli", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "keyring>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
aws = [
    "boto3>=1.35",
]
dev = [
    "snowbot[ui,aws]",
    "boto3-stubs[bedrock-runtime,s3,secretsmanager]>=1.35",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-playwright>=0.5",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
snowbot = "snowbot.cli:main"

[project.urls]
Homepage = "https://github.com/therealadarsh/SNOWBot"
Repository = "https://github.com/therealadarsh/SNOWBot"
Issues = "https://github.com/therealadarsh/SNOWBot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snowbot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
packages = ["snowbot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a browser, Docker, AWS or a live service run in their own CI jobs
# (`pytest -m ui`, `pytest -m docker`); the default run deselects them.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m",
    "not (ui or docker or aws or integration)",
]
markers = [
    "integration: hits a live external service; run explicitly with -m integration",
    "ui: needs Playwright browsers; run with -m ui",
    "docker: needs a Docker daemon; run with -m docker",
    "aws: needs AWS credentials; run with -m aws",
]

[tool.coverage.run]
branch = true
source = ["snowbot"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
