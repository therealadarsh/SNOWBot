name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: pytest --cov=snowbot --cov-report=term-missing --cov-fail-under=85

      - name: Memory status check
        run: snowbot status --check

  wheel:
    name: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build and install the wheel outside the source tree
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/snowbot" --help
          "$RUNNER_TEMP/wheel-venv/bin/snowbot" validate --phase 1 --dry-run

  ui:
    name: ui tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      # Exit code 5 means no tests carry the marker yet.
      - name: Pytest (ui marker)
        run: |
          set +e
          pytest -m ui
          rc=$?
          if [[ "$rc" -eq 5 ]]; then echo "No ui tests yet"; exit 0; fi
          exit "$rc"

  docker:
    name: docker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (docker marker)
        run: |
          set +e
          pytest -m docker
          rc=$?
          if [[ "$rc" -eq 5 ]]; then echo "No docker tests yet"; exit 0; fi
          exit "$rc"

  infra:
    name: infra synth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect infra code
        id: detect
        run: |
          if [[ -f infra/cdk.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No infra/cdk.json yet"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install CDK (hash-pinned Python deps, no npm scripts)
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r infra/requirements.txt
          pip install -e ".[dev]"
          npm ci --prefix infra --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/infra/node_modules/.bin" >> "$GITHUB_PATH"

      - name: cdk synth (no credentials)
        if: steps.detect.outputs.present == 'true'
        working-directory: infra
        run: cdk synth --quiet

      - name: Sample app and infra tests
        if: steps.detect.outputs.present == 'true'
        run: |
          set +e
          pytest examples infra
          rc=$?
          if [[ "$rc" -eq 5 ]]; then echo "No sample-app or infra tests yet"; exit 0; fi
          exit "$rc"

  test-inventory:
    name: test-inventory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Checkout PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # `-m ""` lists marker-deselected tests too, so ui/docker tests are inventoried.
      - name: Collect test ids on base and head
        run: |
          set -euo pipefail
          for side in base head; do
            python -m venv "$RUNNER_TEMP/venv-$side"
            "$RUNNER_TEMP/venv-$side/bin/pip" install -q -e "./$side[dev]"
            (cd "$side" && "$RUNNER_TEMP/venv-$side/bin/pytest" --collect-only -q -m "" -p no:cacheprovider) \
              | grep '::' | sort -u > "$RUNNER_TEMP/$side.txt"
            echo "$side: $(wc -l < "$RUNNER_TEMP/$side.txt") test ids"
          done

      - name: Fail if a base test id disappeared
        run: |
          set -euo pipefail
          comm -23 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" > "$RUNNER_TEMP/missing.txt"
          if [[ -s "$RUNNER_TEMP/missing.txt" ]]; then
            echo "::error::Test ids present on the base are missing on the head:"
            cat "$RUNNER_TEMP/missing.txt"
            exit 1
          fi
          echo "Every base test id still exists."

  ci:
    name: CI
    if: always()
    needs: [test, wheel, ui, docker, infra]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then exit 1; fi
          done
