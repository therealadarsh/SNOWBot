name: architect-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: architect-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architect-gate:
    name: architect-gate
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-architect')
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve validation phase
        id: phase
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DEFAULT_GOVERNANCE_PHASE: "1b"
        run: |
          set -euo pipefail
          phase="$(python3 - <<'PY'
          import os
          import re

          labels = [x for x in os.environ.get("PR_LABELS", "").split() if x]
          phase = ""
          for label in labels:
              if label.startswith("phase:"):
                  phase = label.split(":", 1)[1]
                  break
          if not phase and "governance" in labels:
              phase = os.environ.get("DEFAULT_GOVERNANCE_PHASE", "1b")
          if not phase:
              body = os.environ.get("PR_BODY") or ""
              match = re.search(r"(?im)^[ \t]*Phase:[ \t]*([0-9]+[a-z]?)", body)
              if match:
                  phase = match.group(1)
          if not phase:
              phase = "1b"
          print(phase, end="")
          PY
          )"
          echo "id=$phase" >> "$GITHUB_OUTPUT"
          echo "Resolved phase: $phase"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch base branch for diff checks
        run: git fetch origin main:refs/remotes/origin/main

      - name: Independent validation (script or equivalent)
        id: validate
        env:
          SNOWBOT_PHASE_ID: ${{ steps.phase.outputs.id }}
          SNOWBOT_VALIDATE_BASE: origin/main
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          verdict="pass"
          summary=""

          run_equivalent() {
            ruff check src tests
            ruff format --check src tests
            mypy
            pytest --cov=snowbot --cov-report=term-missing --cov-fail-under=85
            set +e
            validate_out="$(snowbot validate --phase "$SNOWBOT_PHASE_ID" --base-ref "$SNOWBOT_VALIDATE_BASE" --pr "$PR_URL" 2>&1)"
            validate_rc=$?
            set -e
            echo "$validate_out"
            if [[ "$validate_rc" -ne 0 ]]; then
              if echo "$validate_out" | grep -q "governance_mixed_with_product"; then
                verdict="pass_with_notes"
                summary="Phase validate noted governance_mixed_with_product (bootstrap/governance PR exception)."
                validate_rc=0
              else
                echo "snowbot validate failed"
                exit "$validate_rc"
              fi
            fi
            snowbot status --check
          }

          if [[ -f scripts/independent_validate.sh ]]; then
            chmod +x scripts/independent_validate.sh
            set +e
            script_out="$(./scripts/independent_validate.sh 2>&1)"
            script_rc=$?
            set -e
            echo "$script_out"
            if [[ "$script_rc" -ne 0 ]]; then
              if echo "$script_out" | grep -q "governance_mixed_with_product"; then
                verdict="pass_with_notes"
                summary="Independent script noted governance_mixed_with_product."
              else
                exit "$script_rc"
              fi
            fi
            if echo "$script_out" | grep -q "verdict=pass_with_notes"; then
              verdict="pass_with_notes"
              summary="Independent validation pass_with_notes (see workflow log)."
            fi
          else
            run_equivalent
          fi

          {
            echo "verdict=$verdict"
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post architect summary comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.validate.outputs.verdict }}
          PHASE: ${{ steps.phase.outputs.id }}
          NOTES: ${{ steps.validate.outputs.summary }}
        run: |
          body_file="$RUNNER_TEMP/architect-summary.md"
          {
            echo "## Senior Software Architect (CI)"
            echo
            echo "**Verdict:** \`${VERDICT}\`"
            echo "**Phase:** \`${PHASE}\`"
            echo "**Job:** \`architect-gate\`"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| ruff | pass |"
            echo "| mypy | pass |"
            echo "| pytest (≥85% cov) | pass |"
            echo "| snowbot validate | pass |"
            echo "| memory status | pass |"
            echo
            echo "This comment is informational only — it is **not** a GitHub PR approval."
            if [[ -n "${NOTES:-}" ]]; then
              echo
              echo "${NOTES}"
            fi
          } > "$body_file"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file"
